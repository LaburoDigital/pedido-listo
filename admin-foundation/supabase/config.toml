# Local test environment, pinned Supabase CLI 2.121.0.
project_id = "pedido-listo-admin-foundation"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Enables email login; public signup remains disabled by [auth].enable_signup.
enable_signup = true
enable_confirmations = true

[studio]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
